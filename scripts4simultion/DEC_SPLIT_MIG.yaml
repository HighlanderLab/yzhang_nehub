description: pig demographic model with migration
time_units: generations

demes:
- name: ancester
  start_time: .inf
  epochs:
    - {start_size: 20_000, end_time: 200_000}
- name: pop1
  start_time: 200_000
  epochs:
    - {start_size: 25_000,end_time: 20_000}
    - {start_size: 20_000,end_time: 2_000}
    - {start_size: 12_500,end_time: 200}
    - {start_size: 5_000,end_time: 20}
    - {start_size: 1_000,}
  ancestors: [ancester]
- name: pop2 
  epochs:
    - {start_size: 20_000,end_time: 20_000}
    - {start_size: 16_000,end_time: 2000}
    - {start_size: 3_000,end_time: 200}
    - {start_size: 1_200,end_time: 20}
    - {start_size: 200,}
  ancestors: [ancester]
migrations:
  - source: pop1 # source and dest is reversible with msprime
    dest: pop2
    start_time: 200000
    end_time: 0
    rate: 4e-3
  - source: pop2
    dest: pop1
    start_time: 200000
    end_time: 0
    rate: 5e-3